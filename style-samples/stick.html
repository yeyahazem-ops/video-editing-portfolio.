<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Stick-figure comic style test: Yasin kicks the ball, it bonks Uncle Fathy's head, then both burst out laughing.
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const INK = '#141414';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - Math.pow(1 - t, 3), back = (t, s = 2.4) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
let F = 0; // frame-on-twos counter for line boil
const j = (k, amp = 1.6) => (hash(F, k) - 0.5) * 2 * amp;

function ellipse(x, y, rx, ry, fill, lw = 7, k = 0) { ctx.beginPath(); ctx.ellipse(x + j(k, 0.8), y + j(k + 1, 0.8), rx, ry, 0, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.stroke(); } }
function limb(pts, lw = 11, k = 0) { ctx.beginPath(); pts.forEach(([x, y], i) => { x += j(k + i); y += j(k + i + 9); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.lineWidth = lw; ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.stroke(); }
function poly(pts, fill, lw = 7, k = 0) { ctx.beginPath(); pts.forEach(([x, y], i) => { x += j(k + i, 1); y += j(k + i + 5, 1); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.stroke(); }
const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16); const f = (v) => Math.round(clamp(v * k, 0, 255)); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; };

// a stick person. o: x, y (feet), s, shirt, long (robe), face: 'laugh'|'shock'|'grin'|'ouch', cap, bald, glasses, mustache, armL/armR targets, legPose, lean
function person(o) {
  const { x, y, s = 1, shirt, face, lean = 0, squash = 1 } = o;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (2 - squash), s * squash); ctx.rotate(lean);
  // legs
  const hipY = -330, legs = o.legs || [[-40, 0], [40, 0]];
  limb([[-22, hipY], [lerp(-22, legs[0][0], 0.5) - 14, hipY / 2 + legs[0][1] / 2], legs[0]], 12, 10);
  limb([[22, hipY], [lerp(22, legs[1][0], 0.5) + 14, hipY / 2 + legs[1][1] / 2], legs[1]], 12, 20);
  for (const [fx, fy] of legs) ellipse(fx + (fx < 0 ? -14 : 14), fy + 4, 34, 14, INK, 0, 30);
  // shirt / robe
  const top = -590, bot = o.long ? -60 : hipY + 10;
  poly([[-80, top + 20], [-118, top + 90], [-96, top + 120], [-78, top + 100], [-74, bot], [74, bot], [78, top + 100], [96, top + 120], [118, top + 90], [80, top + 20], [30, top], [-30, top]], shirt, 7, 40);
  ctx.save(); ctx.globalAlpha = 0.18; poly([[30, top + 10], [74, top + 40], [74, bot - 6], [40, bot - 6]], INK, 0, 50); ctx.restore();
  if (o.number) { ctx.font = '900 64px Arial Black, Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.strokeText(o.number, 0, top + 150); ctx.fillText(o.number, 0, top + 150); }
  // arms from the sleeves to hand targets
  const aL = o.armL || [-120, -380], aR = o.armR || [120, -380];
  limb([[-104, top + 105], [(-104 + aL[0]) / 2 - 20, (top + 105 + aL[1]) / 2], aL], 11, 60); ellipse(aL[0], aL[1], 20, 18, INK, 0, 61);
  limb([[104, top + 105], [(104 + aR[0]) / 2 + 20, (top + 105 + aR[1]) / 2], aR], 11, 70); ellipse(aR[0], aR[1], 20, 18, INK, 0, 71);
  // head
  const hy = top - 150; ctx.save(); ctx.translate(0, hy); ctx.rotate(o.headTilt || 0);
  ellipse(0, 0, 155, 150, '#FAFAF7', 8, 80);
  ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, 150, 145, 0, 0, Math.PI * 2); ctx.clip(); ctx.fillStyle = 'rgba(0,0,0,0.07)'; ctx.beginPath(); ctx.ellipse(60, 30, 140, 150, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  if (o.hair) { ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(-150, -20); for (let i = 0; i <= 10; i++) { const a = Math.PI + (i / 10) * Math.PI; ctx.lineTo(Math.cos(a) * (158 + (i % 2) * 26), Math.sin(a) * (152 + (i % 2) * 26) + 10); } ctx.lineTo(150, -20); ctx.quadraticCurveTo(0, -95, -150, -20); ctx.fill(); }
  if (o.bald) { ctx.fillStyle = '#D8D6D0'; for (const sd of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sd * 146, 10, 22, 46, 0, 0, Math.PI * 2); ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke(); } }
  // face
  if (face === 'laugh') {
    for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sd * 30, -32); ctx.quadraticCurveTo(sd * 62, -70, sd * 96, -36); ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.strokeStyle = INK; ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(-92, 10); ctx.quadraticCurveTo(0, 22, 92, 10); ctx.quadraticCurveTo(70, 135, 0, 135); ctx.quadraticCurveTo(-70, 135, -92, 10); ctx.fillStyle = '#3a1416'; ctx.fill(); ctx.lineWidth = 7; ctx.stroke();
    ctx.save(); ctx.clip(); ctx.fillStyle = '#fff'; ctx.fillRect(-90, 6, 180, 26); ctx.fillStyle = '#E86A72'; ctx.beginPath(); ctx.ellipse(0, 128, 48, 30, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  } else if (face === 'shock') {
    for (const sd of [-1, 1]) { ellipse(sd * 52, -40, 34, 42, '#fff', 6, 90 + sd); ellipse(sd * 52, -34, 12, 14, INK, 0, 92 + sd); }
    ellipse(0, 70, 30, 40, '#3a1416', 7, 95);
  } else if (face === 'ouch') {
    for (const sd of [-1, 1]) { limb([[sd * 28, -60], [sd * 88, -36], [sd * 28, -12]], 8, 97 + sd); }
    ctx.beginPath(); ctx.moveTo(-60, 70); for (let i = 1; i <= 6; i++) ctx.lineTo(-60 + i * 20, 70 + (i % 2 ? -14 : 0)); ctx.lineWidth = 8; ctx.strokeStyle = INK; ctx.stroke();
  } else {
    for (const sd of [-1, 1]) ellipse(sd * 52, -30, 13, 18, INK, 0, 100 + sd);
    ctx.beginPath(); ctx.moveTo(-70, 40); ctx.quadraticCurveTo(0, 110, 70, 40); ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.strokeStyle = INK; ctx.stroke();
  }
  if (o.glasses) for (const sd of [-1, 1]) { ctx.beginPath(); ctx.arc(sd * 60, -40, 44, 0, Math.PI * 2); ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.stroke(); }
  if (o.glasses) { ctx.beginPath(); ctx.moveTo(-16, -44); ctx.lineTo(16, -44); ctx.stroke(); }
  if (o.mustache) { ctx.fillStyle = '#D8D6D0'; ctx.beginPath(); ctx.ellipse(-36, face === 'laugh' ? 4 : 30, 44, 16, 0.2, 0, Math.PI * 2); ctx.ellipse(36, face === 'laugh' ? 4 : 30, 44, 16, -0.2, 0, Math.PI * 2); ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke(); }
  if (o.blush) for (const sd of [-1, 1]) { ctx.fillStyle = 'rgba(240,110,120,0.45)'; ctx.beginPath(); ctx.ellipse(sd * 104, 26, 26, 14, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
  ctx.restore();
  return { headX: x, headY: y + (top - 150) * s * squash };
}
function tears(hx, hy, t, s, side) { for (let k = 0; k < 4; k++) { const a = ((t * 2.2 + k / 4) % 1); const dx = side * (80 + a * 170) * s, dy = (-40 - 90 * a + 260 * a * a) * s; ctx.save(); ctx.globalAlpha = 1 - a * 0.6; ctx.translate(hx + dx, hy + dy); ctx.rotate(side * (0.6 + a)); ctx.beginPath(); ctx.moveTo(0, -18 * s); ctx.quadraticCurveTo(14 * s, 4 * s, 0, 14 * s); ctx.quadraticCurveTo(-14 * s, 4 * s, 0, -18 * s); ctx.fillStyle = '#8FD3F5'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#2a6a8a'; ctx.stroke(); ctx.restore(); } }
function shakeLines(x, y, s, t) { ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.lineCap = 'round'; for (const sd of [-1, 1]) for (let k = 0; k < 3; k++) { const ox = x + sd * (150 + k * 22) * s, oy = y + (-420 + k * 60) * s + Math.sin(t * 30 + k) * 4; ctx.beginPath(); ctx.arc(ox, oy, 26 * s, sd > 0 ? -0.7 : Math.PI - 0.7, sd > 0 ? 0.7 : Math.PI + 0.7); ctx.stroke(); } }
function ball(x, y, r, rot) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ellipse(0, 0, r, r, '#fff', 6, 300); ctx.fillStyle = INK; for (const [px, py, pr] of [[0, 0, 0.33], [0.7, -0.5, 0.25], [-0.7, -0.5, 0.25], [0.5, 0.75, 0.25], [-0.5, 0.75, 0.25]]) { ctx.beginPath(); for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; ctx.lineTo(px * r + Math.cos(a) * pr * r, py * r + Math.sin(a) * pr * r); } ctx.fill(); } ctx.restore(); }
function word(txt, x, y, size, col, t0, t, rot = -0.1) { if (t < t0) return; const p = back(clamp((t - t0) / 0.25)); ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(p, p); ctx.font = `900 ${size}px "Arial Black", Impact, sans-serif`; ctx.textAlign = 'center'; ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.16; ctx.strokeStyle = INK; ctx.strokeText(txt, 0, 0); ctx.fillStyle = col; ctx.fillText(txt, 0, 0); ctx.restore(); }

window.renderAt = (t) => {
  F = Math.floor(t * 12); // the line boils on twos
  const g = ctx.createRadialGradient(W / 2, H * 0.45, 200, W / 2, H * 0.5, 1300); g.addColorStop(0, '#F4F1EA'); g.addColorStop(1, '#CFCAC0'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.08)'; ctx.beginPath(); ctx.ellipse(W / 2, 1690, 520, 40, 0, 0, Math.PI * 2); ctx.fill();
  const KICK = 0.9, BONK = 1.55, LAUGH = 2.3;
  const s = 0.95, YX = 290, FX = 800, GY = 1680;
  // Yasin: wind-up, kick, then laugh
  const wind = clamp((t - 0.3) / 0.6), kicked = t >= KICK, laugh = t >= LAUGH;
  const bounce = laugh ? Math.abs(Math.sin((t - LAUGH) * 11)) : 0;
  const yLegs = !kicked ? [[-40, 0], [40 - 60 * wind, -10 * wind]] : t < KICK + 0.4 ? [[-40, 0], [140, -170]] : [[-40, 0], [40, 0]];
  const yh = person({ x: YX, y: GY - bounce * 30, s, shirt: '#E9483B', number: '10', hair: true, face: laugh ? 'laugh' : t > BONK ? 'shock' : 'grin', legs: laugh ? [[-60 - bounce * 10, 0], [60 + bounce * 10, 0]] : yLegs, lean: laugh ? -0.06 : -0.1 * wind, squash: 1 - 0.05 * bounce, armL: laugh ? [-60, -360] : [-150, -420], armR: laugh ? [60, -360] : [150, -440], headTilt: laugh ? -0.15 : 0 });
  // Uncle Fathy: ouch on the bonk, then laughs too
  const fb = laugh ? Math.abs(Math.sin((t - LAUGH) * 10 + 1)) : 0;
  const ouch = t >= BONK && t < LAUGH;
  const fh = person({ x: FX, y: GY - fb * 26, s: 1.0, shirt: '#8FA9C4', long: true, bald: true, glasses: true, mustache: true, face: laugh ? 'laugh' : ouch ? 'ouch' : 'grin', legs: laugh ? [[-50, 0], [50, 0]] : [[-38, 0], [38, 0]], armL: laugh ? [-50, -330] : ouch ? [-40, -800] : [-120, -360], armR: laugh ? [50, -330] : [120, -360], lean: laugh ? 0.06 : ouch ? 0.08 * Math.sin((t - BONK) * 30) : 0, squash: 1 - 0.05 * fb, headTilt: laugh ? 0.15 : 0, blush: laugh });
  if (laugh) { tears(yh.headX, yh.headY, t, s, -1); tears(yh.headX, yh.headY, t + 0.3, s, 1); tears(fh.headX, fh.headY, t + 0.15, 1, -1); tears(fh.headX, fh.headY, t + 0.45, 1, 1); shakeLines(YX, GY, s, t); shakeLines(FX, GY, 1, t); word('HA HA HA!', W / 2, 330, 120, '#FFD23F', LAUGH + 0.1, t, -0.06); }
  // the ball: rests, flies on the kick, bonks his head, drops
  if (!kicked) ball(YX + 150, GY - 40, 44, 0);
  else if (t < BONK) { const u = clamp((t - KICK) / (BONK - KICK)); const bx = lerp(YX + 170, fh.headX, u), by = lerp(GY - 140, fh.headY - 120, u) - 300 * Math.sin(Math.PI * u); for (let k = 1; k < 5; k++) { ctx.save(); ctx.globalAlpha = 0.18; ball(bx - k * 30, by + k * 12, 44, 0); ctx.restore(); } ball(bx, by, 44, t * 20); }
  else { const a = t - BONK, bx = fh.headX + 120 + a * 260, by = fh.headY - 140 + (-500 * a + 1600 * a * a); if (by < GY - 40) ball(bx, by, 44, t * 15); else ball(bx + 40, GY - 40, 44, 0); }
  if (kicked && t < BONK + 0.2) word('KICK!', YX + 120, GY - 520, 110, '#FF8A3D', KICK, t, -0.15);
  if (t >= BONK) { if (t < LAUGH) word('BONK!', fh.headX + 40, fh.headY - 300, 130, '#FFFFFF', BONK, t, 0.12); if (t < LAUGH) for (let k = 0; k < 5; k++) { const a = (t - BONK) * 6 + k * 1.25; ctx.save(); ctx.translate(fh.headX + Math.cos(a) * 170, fh.headY - 170 + Math.sin(a) * 40); ctx.fillStyle = '#FFD23F'; ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 10 : 24, aa = -Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(Math.cos(aa) * r, Math.sin(aa) * r); } ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); } }
  return cv.toDataURL('image/png');
};
window.DONE = true;
</script></body></html>
