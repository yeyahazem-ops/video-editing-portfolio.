<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}#out{position:absolute;left:0;top:0}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script></head><body>
<script type="module">
// The same little scene (Yasin, the ball, Uncle Fathy, his house and window) in four 3D looks.
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const STYLE = new URLSearchParams(location.search).get('s') || 'lowpoly';
const W = 1920, H = 1080;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
let sd = 11; const rnd = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
const add = (geo, mat, x, y, z, p = scene) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; p.add(m); return m; };
const gradientBg = (top, bottom) => { const c = document.createElement('canvas'); c.width = 2; c.height = 256; const x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, top); g.addColorStop(1, bottom); x.fillStyle = g; x.fillRect(0, 0, 2, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
const sun = (int = 2.4, pos = [6, 12, 8], col = 0xfff1d6) => { const s = new THREE.DirectionalLight(col, int); s.position.set(...pos); s.castShadow = true; s.shadow.mapSize.set(2048, 2048); Object.assign(s.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 }); s.shadow.bias = -0.0006; scene.add(s); return s; };
function ortho(zoom, pos, look) { const a = W / H; const c = new THREE.OrthographicCamera(-zoom * a, zoom * a, zoom, -zoom, 0.1, 200); c.position.set(...pos); c.lookAt(...look); return c; }

// ================= 11. LOW-POLY ISLAND =================
function lowpoly() {
  scene.background = gradientBg('#9fd3f2', '#fde6d0'); scene.fog = new THREE.Fog('#fde6d0', 40, 90);
  scene.add(new THREE.HemisphereLight(0xeaf6ff, 0xd9b38c, 1.3)); sun(2.6, [10, 16, 6]);
  const F = (c) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.9 });
  // faceted water
  const wg = new THREE.PlaneGeometry(80, 80, 60, 60); const pa = wg.attributes.position; for (let i = 0; i < pa.count; i++) pa.setZ(i, Math.sin(pa.getX(i) * 0.8) * 0.12 + Math.cos(pa.getY(i) * 0.9) * 0.12 + rnd() * 0.08); wg.computeVertexNormals();
  add(wg.toNonIndexed(), new THREE.MeshStandardMaterial({ color: '#5cc3d6', flatShading: true, roughness: 0.4 }), 0, -0.3, 0).rotation.x = -Math.PI / 2;
  // the island: hex tiles
  const hex = new THREE.CylinderGeometry(1, 1, 0.6, 6);
  for (let q = -4; q <= 4; q++) for (let k = -4; k <= 4; k++) { const x = q * 1.5, z = k * 1.73 + (q % 2 ? 0.86 : 0); if (Math.hypot(x, z) > 6.4) continue; const sand = Math.hypot(x, z) > 5; add(hex, F(sand ? '#f2d39a' : ['#8fcf6a', '#7fc45e', '#9bd774'][Math.floor(rnd() * 3)]), x, sand ? -0.05 : 0.05 + rnd() * 0.08, z); }
  // a little house
  add(new THREE.BoxGeometry(2.6, 2, 2.2), F('#f4a07a'), 2.4, 1.3, -1.6);
  const roof = add(new THREE.ConeGeometry(2.1, 1.3, 4), F('#e2604b'), 2.4, 2.95, -1.6); roof.rotation.y = Math.PI / 4;
  add(new THREE.BoxGeometry(0.7, 0.6, 0.1), F('#9fdcf0'), 1.8, 1.5, -0.48); add(new THREE.BoxGeometry(0.6, 1.1, 0.1), F('#8a5a3b'), 3.0, 0.85, -0.48);
  // trees
  for (const [x, z, s] of [[-3.6, -2.2, 1], [-4.3, 0.5, 0.8], [4.8, 1.6, 0.9], [-1.6, -3.6, 0.7]]) { add(new THREE.CylinderGeometry(0.12 * s, 0.18 * s, 0.9 * s, 5), F('#8a5a3b'), x, 0.65 * s, z); add(new THREE.IcosahedronGeometry(0.75 * s, 0), F('#4fae5f'), x, 1.5 * s, z); }
  // people: chunky low-poly figures
  const person = (x, z, shirt, pants, skin, h = 1, robe = false) => {
    if (robe) add(new THREE.CylinderGeometry(0.32, 0.48, 1.2 * h, 6), F(shirt), x, 0.95 * h, z);
    else { add(new THREE.BoxGeometry(0.18, 0.5, 0.18), F(pants), x - 0.13, 0.6, z); add(new THREE.BoxGeometry(0.18, 0.5, 0.18), F(pants), x + 0.13, 0.6, z); add(new THREE.CylinderGeometry(0.3, 0.34, 0.6, 6), F(shirt), x, 1.15, z); }
    add(new THREE.IcosahedronGeometry(0.33 * h, 1), F(skin), x, robe ? 1.9 * h : 1.75, z);
  };
  person(-0.6, 1.4, '#e9483b', '#2b4c7e', '#c98b5a'); add(new THREE.SphereGeometry(0.34, 8, 6), F('#2a1c14'), -0.6, 1.88, 1.4).scale.set(1, 0.6, 1);
  person(1.3, 0.6, '#8fa9c4', '', '#b9835a', 1.1, true);
  add(new THREE.IcosahedronGeometry(0.17, 1), F('#ffffff'), 0.1, 0.45, 1.9);
  return ortho(5.4, [14, 12, 14], [0.3, 0.8, 0]);
}

// ================= 12. ISOMETRIC PICTURE BOOK =================
function iso() {
  scene.background = new THREE.Color('#F1E8D8');
  // three fixed tones per colour: top lit warm, two sides darker (flat lambert with three lights)
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const l1 = new THREE.DirectionalLight(0xfff4e0, 1.25); l1.position.set(0, 10, 0); scene.add(l1);
  const l2 = new THREE.DirectionalLight(0xffffff, 0.55); l2.position.set(0, 0, 10); scene.add(l2);
  const l3 = new THREE.DirectionalLight(0xffffff, 0.25); l3.position.set(10, 0, 0); scene.add(l3);
  const F = (c) => new THREE.MeshLambertMaterial({ color: c, flatShading: true });
  add(new THREE.BoxGeometry(40, 0.2, 40), F('#EAE2D3'), 0, -0.1, 0);
  // slab grid and a painted lane
  for (let i = -10; i <= 10; i++) { add(new THREE.BoxGeometry(40, 0.01, 0.03), F('#ddd2bf'), 0, 0.01, i * 2); add(new THREE.BoxGeometry(0.03, 0.01, 40), F('#ddd2bf'), i * 2, 0.01, 0); }
  add(new THREE.BoxGeometry(0.6, 0.02, 7), F('#E2AE3A'), -1.6, 0.02, 0.5);
  // houses as clean blocks
  for (const [x, z, w, h, d, c] of [[-4, -4, 3, 4, 3, '#C9B8A2'], [-0.5, -4.5, 3.5, 5, 3, '#A7C2B2'], [3.5, -3.5, 4, 3.6, 3.4, '#D9B48A']]) {
    add(new THREE.BoxGeometry(w, h, d), F(c), x, h / 2, z);
    for (let i = 0; i < 2; i++) for (let j = 0; j < Math.floor(h / 1.4); j++) add(new THREE.BoxGeometry(0.6, 0.7, 0.05), F('#7e98a8'), x - w / 4 + i * w / 2, 0.9 + j * 1.4, z + d / 2 + 0.03);
  }
  add(new THREE.BoxGeometry(0.9, 1.6, 0.05), F('#5a4636'), 4.6, 0.8, -1.78);
  // the window with the accent: it is the subject of the story
  add(new THREE.BoxGeometry(1.2, 1.0, 0.06), F('#D0573A'), 2.6, 1.7, -1.76);
  // people: faceted columns with round heads; Yasin is the accent
  const person = (x, z, body, h) => { add(new THREE.CylinderGeometry(0.28, 0.3, h, 8), F(body), x, h / 2, z); add(new THREE.SphereGeometry(0.24, 10, 8), F('#c9925f'), x, h + 0.26, z); };
  person(-0.4, 0.8, '#D0573A', 1.05); add(new THREE.SphereGeometry(0.25, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), F('#2A2E29'), -0.4, 1.33, 0.8);
  person(1.6, 0, '#3D6B59', 1.5);
  add(new THREE.SphereGeometry(0.16, 10, 8), F('#ffffff'), 0.3, 0.16, 1.3);
  // a dashed path for the ball
  for (let i = 0; i < 6; i++) add(new THREE.BoxGeometry(0.22, 0.02, 0.08), F('#D0573A'), 0.5 + i * 0.36, 0.03, 1.1 - i * 0.48).rotation.y = 0.9;
  return ortho(5.2, [12, 12, 12], [0.4, 0.8, -0.8]);
}

// ================= 13. BRICK TOY =================
function brick() {
  scene.background = gradientBg('#7ec8f2', '#d9f0ff');
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.4)); sun(2.6, [6, 14, 9]);
  const P = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.28, metalness: 0.0 });
  const U = 0.4; // one stud pitch
  const stud = new THREE.CylinderGeometry(U * 0.3, U * 0.3, U * 0.18, 20);
  const bricky = (x, y, z, nx, nz, h, col, studs = true) => { const m = P(col); add(new RoundedBoxGeometry(nx * U - 0.01, h * U * 1.2 - 0.01, nz * U - 0.01, 2, 0.02), m, x, y + h * U * 0.6, z); if (studs) for (let i = 0; i < nx; i++) for (let k = 0; k < nz; k++) add(stud, m, x - nx * U / 2 + U / 2 + i * U, y + h * U * 1.2 + U * 0.09, z - nz * U / 2 + U / 2 + k * U); };
  // base plate
  const plate = P('#237841'); add(new THREE.BoxGeometry(16, 0.12, 10), plate, 0, 0.06, 0); for (let i = 0; i < 40; i++) for (let k = 0; k < 25; k++) add(stud, plate, -8 + U / 2 + i * U, 0.16, -5 + U / 2 + k * U);
  // the house: rows of running-bond bricks with a window gap
  for (let row = 0; row < 12; row++) for (let col = 0; col < 7; col++) {
    const x = 0.6 + col * 0.8 + (row % 2 ? 0.4 : 0), y = 0.12 + row * U * 1.2; if (x > 6) continue;
    const inWindow = row >= 4 && row <= 8 && x > 1.6 && x < 3.6; const inDoor = row <= 6 && x > 4.4 && x < 5.4;
    if (inWindow || inDoor) continue;
    bricky(x, y, -2, 2, 1, 1, '#c91a09', row === 11);
  }
  add(new THREE.BoxGeometry(1.9, 2.3, 0.05), P('#9fd8f5'), 2.6, 2.8, -2); add(new THREE.BoxGeometry(0.06, 2.3, 0.1), P('#f2f2ee'), 2.6, 2.8, -1.95);
  add(new THREE.BoxGeometry(1.0, 3.2, 0.1), P('#6b3d1e'), 4.9, 1.75, -2);
  // a toy figure: cylinder head with a stud, trapezoid torso, block legs, C-hands
  const fig = (x, z, torso, legs, skin, hair) => {
    const g = new THREE.Group(); g.position.set(x, 0.12, z); scene.add(g);
    add(new RoundedBoxGeometry(0.34, 0.75, 0.34, 2, 0.03), P(legs), -0.18, 0.38, 0, g); add(new RoundedBoxGeometry(0.34, 0.75, 0.34, 2, 0.03), P(legs), 0.18, 0.38, 0, g);
    const t = add(new THREE.CylinderGeometry(0.34, 0.46, 0.78, 4), P(torso), 0, 1.15, 0, g); t.rotation.y = Math.PI / 4; t.scale.set(1, 1, 0.55);
    for (const s of [-1, 1]) { const a = add(new THREE.CylinderGeometry(0.09, 0.1, 0.55, 12), P(torso), s * 0.5, 1.15, 0.05, g); a.rotation.z = s * 0.25; add(new THREE.TorusGeometry(0.09, 0.04, 8, 16, Math.PI * 1.5), P(skin), s * 0.58, 0.82, 0.1, g); }
    add(new THREE.CylinderGeometry(0.27, 0.27, 0.5, 24), P(skin), 0, 1.84, 0, g); add(new THREE.CylinderGeometry(0.13, 0.13, 0.12, 16), P(skin), 0, 2.14, 0, g);
    if (hair) add(new THREE.SphereGeometry(0.3, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2.2), P(hair), 0, 1.98, 0, g);
    for (const s of [-1, 1]) add(new THREE.SphereGeometry(0.035, 8, 8), P('#1b2a34'), s * 0.09, 1.9, 0.26, g);
    const sm = add(new THREE.TorusGeometry(0.08, 0.018, 6, 16, Math.PI), P('#1b2a34'), 0, 1.76, 0.26, g); sm.rotation.z = Math.PI;
    return g;
  };
  fig(-1.8, 0.8, '#c91a09', '#0055bf', '#f2cd37', '#3b2a1e').rotation.y = 0.35;
  const u = fig(1.0, 0.2, '#8fa9c4', '#8fa9c4', '#f2cd37', null); u.rotation.y = -0.3; u.scale.setScalar(1.12);
  add(new THREE.SphereGeometry(0.2, 20, 20), P('#f2f2ee'), -0.6, 0.32, 1.6);
  const c = new THREE.PerspectiveCamera(30, W / H, 0.1, 100); c.position.set(-1.8, 4.6, 11.5); c.lookAt(0.8, 1.6, -0.5); return c;
}

// ================= 14. HD-2D =================
function hd2d() {
  scene.background = gradientBg('#2b3a67', '#f0a868'); scene.fog = new THREE.Fog('#e8b07a', 14, 34);
  scene.add(new THREE.HemisphereLight(0xffd9a8, 0x3a4060, 0.9));
  const s = sun(2.2, [-8, 10, 6], 0xffc890);
  const lamp = new THREE.PointLight(0xffb060, 30, 8, 1.6); lamp.position.set(1.6, 3.2, -0.6); scene.add(lamp);
  // pixel textures
  const pix = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); draw(x); const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace; return t; };
  const bricks = pix(32, 32, (x) => { x.fillStyle = '#b8725a'; x.fillRect(0, 0, 32, 32); for (let r = 0; r < 8; r++) for (let k = 0; k < 4; k++) { x.fillStyle = ['#c98468', '#a8644e', '#b8725a'][(r + k) % 3]; x.fillRect(k * 8 + (r % 2) * 4, r * 4, 7, 3); } }); bricks.wrapS = bricks.wrapT = THREE.RepeatWrapping; bricks.repeat.set(3, 3);
  const stone = pix(32, 32, (x) => { x.fillStyle = '#8c8577'; x.fillRect(0, 0, 32, 32); for (let i = 0; i < 40; i++) { x.fillStyle = ['#9d9686', '#7a7466', '#a8a090'][i % 3]; x.fillRect(Math.floor(rnd() * 30), Math.floor(rnd() * 30), 3, 2); } }); stone.wrapS = stone.wrapT = THREE.RepeatWrapping; stone.repeat.set(10, 10);
  const M = (o) => new THREE.MeshStandardMaterial({ roughness: 0.85, ...o });
  add(new THREE.PlaneGeometry(40, 40), M({ map: stone }), 0, 0, 0).rotation.x = -Math.PI / 2;
  add(new THREE.BoxGeometry(6, 5, 3), M({ map: bricks }), 2.2, 2.5, -3);
  add(new THREE.BoxGeometry(5, 7, 3), M({ map: bricks, color: '#b0c4d0' }), -4.2, 3.5, -4);
  const roof = add(new THREE.ConeGeometry(4.6, 2, 4), M({ color: '#4a5a8a' }), 2.2, 6, -3); roof.rotation.y = Math.PI / 4;
  add(new THREE.BoxGeometry(1.3, 1.1, 0.1), M({ color: '#ffd27a', emissive: '#ff9a3a', emissiveIntensity: 1.4 }), 1.0, 2.4, -1.45);
  add(new THREE.BoxGeometry(1.1, 2, 0.1), M({ color: '#5a3a24' }), 3.6, 1, -1.45);
  // pixel-art sprites as billboards
  const sprite = (rows, pal, scale, x, z) => {
    const h = rows.length, w = rows[0].length;
    const t = pix(w + 2, h + 2, (c) => { for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) { const k = rows[y][i]; if (k === '.') continue; c.fillStyle = pal[k]; c.fillRect(i + 1, y + 1, 1, 1); } });
    const m = add(new THREE.PlaneGeometry((w + 2) * scale, (h + 2) * scale), new THREE.MeshStandardMaterial({ map: t, transparent: true, alphaTest: 0.5, side: THREE.DoubleSide }), x, (h + 2) * scale / 2, z);
    m.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: t, alphaTest: 0.5 }); return m;
  };
  const kid = ['....hhhh....', '...hhhhhh...', '...hsssss...', '...sweswe...', '...sssss....', '....sms.....', '...rrrrrr...', '..srrwwrrs..', '..srrrrrrs..', '...rrrrrr...', '...bbbbbb...', '...bb..bb...', '...ss..ss...', '...ss..ss...', '..WWW..WWW..'];
  sprite(kid, { h: '#2a1c14', s: '#c98b5a', e: '#1a1010', w: '#ffffff', m: '#7a2e25', r: '#e04a3a', b: '#2b4c7e', W: '#f0f0e8' }, 0.11, -0.8, 0.4);
  const old = ['....ssss....', '...ssssss...', '..gssssssg..', '..gooosoog..', '...ssssss...', '...wwwwww...', '....smms....', '..pppppppp..', '.spppppppps.', '.sppppppppS.', '..pppppppp..', '..pppppppp..', '..pppppppp..', '..pppppppp..', '..pppppppp..', '..pppppppp..', '..dd....dd..'];
  sprite(old, { s: '#b9835a', g: '#e8e6e0', o: '#2a1c14', w: '#e8e6e0', m: '#7a2e25', p: '#8fa9c4', S: '#b9835a', d: '#4a2e1a' }, 0.12, 1.6, 0.2);
  sprite(['.ww.', 'wkww', 'wwkw', '.ww.'], { w: '#ffffff', k: '#222' }, 0.08, 0.2, 1.0);
  // warm dust motes
  for (let i = 0; i < 60; i++) add(new THREE.SphereGeometry(0.02, 4, 4), new THREE.MeshBasicMaterial({ color: '#ffe0a0' }), -4 + rnd() * 9, 0.5 + rnd() * 4, -1 + rnd() * 3);
  const c = new THREE.PerspectiveCamera(28, W / H, 0.1, 100); c.position.set(0.4, 4.6, 9.5); c.lookAt(0.6, 1.2, -0.5); window.TILT = true; return c;
}

const cam = ({ lowpoly, iso, brick, hd2d })[STYLE]();
r.toneMapping = STYLE === 'iso' ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping; r.toneMappingExposure = STYLE === 'hd2d' ? 1.15 : 1.0;
r.render(scene, cam);
// HD-2D: tilt-shift blur on the top and bottom, and a soft bloom
if (window.TILT) {
  const out = document.createElement('canvas'); out.width = W; out.height = H; out.id = 'out'; const o = out.getContext('2d');
  o.filter = 'blur(7px)'; o.drawImage(r.domElement, 0, 0); o.filter = 'none';
  const sharp = document.createElement('canvas'); sharp.width = W; sharp.height = H; const s = sharp.getContext('2d'); s.drawImage(r.domElement, 0, 0);
  s.globalCompositeOperation = 'destination-in'; const g = s.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.38, 'rgba(0,0,0,1)'); g.addColorStop(0.8, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)'); s.fillStyle = g; s.fillRect(0, 0, W, H);
  o.drawImage(sharp, 0, 0); o.globalCompositeOperation = 'screen'; o.globalAlpha = 0.35; o.filter = 'blur(24px) brightness(1.3)'; o.drawImage(r.domElement, 0, 0);
  document.body.appendChild(out);
}
window.DONE = true;
</script></body></html>
